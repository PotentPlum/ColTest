name: Release

on:
  push:
    tags: ["v*"]
  # Manual run from the Actions tab: creates the tag on the selected branch's latest commit.
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and
      # RELEASE_KEY_PASSWORD secrets to sign with a permanent key. Otherwise the debug key is used.
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="pokedex-tracker-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notes="docs/release-notes/${TAG}.md"
          # --target only applies when the tag doesn't exist yet (manual runs).
          args=("$TAG" "$apk" --title "Pokédex Tracker ${TAG}" --target "$GITHUB_SHA")
          if [ -f "$notes" ]; then
            gh release create "${args[@]}" --notes-file "$notes"
          else
            gh release create "${args[@]}" --generate-notes
          fi
